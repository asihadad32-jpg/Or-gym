<html lang="he" dir="rtl">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Or's Gym ⚡</title>

<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060d1a;--surface:#0d1829;--surface2:#142035;--border:#1e3a5f;
  --accent:#3b82f6;--accent2:#fb923c;--accent3:#06b6d4;
  --text:#e8f4ff;--muted:#4a7ab0;
  --fd:'Bebas Neue',sans-serif;--fb:'Heebo',sans-serif;
}
body{background:var(--bg);font-family:var(--fb);color:var(--text);min-height:100vh;overflow-x:hidden;overscroll-behavior-y:none;}
html{overscroll-behavior-y:none;}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 0 20px #3b82f644}50%{box-shadow:0 0 40px #3b82f688}}
@keyframes tick{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.orb1{position:fixed;top:-100px;right:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,#3b82f618,transparent 70%);pointer-events:none;z-index:0}
.orb2{position:fixed;bottom:-80px;left:-60px;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle,#fb923c14,transparent 70%);pointer-events:none;z-index:0}
.workout-timer{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#0d1829;border:1px solid #1e3a5f;border-radius:20px;padding:4px 14px;font-family:var(--fd);font-size:16px;color:var(--accent);letter-spacing:1px;z-index:100;display:none;box-shadow:0 2px 12px #3b82f622;pointer-events:none;}
.workout-timer.visible{display:block;}
#app{position:relative;z-index:1;max-width:420px;margin:0 auto;padding:20px 16px 60px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.logo{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.logo-text{font-family:var(--fd);letter-spacing:2px;font-size:16px;color:var(--accent)}
.back-btn{background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);padding:6px 12px;font-size:12px;cursor:pointer;font-family:var(--fb)}
.progress-bar{background:var(--border);border-radius:4px;height:5px;overflow:hidden;margin-bottom:6px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent3),var(--accent),var(--accent2));border-radius:4px;transition:width .5s ease}
.progress-text{color:var(--muted);font-size:11px;text-align:center;margin-bottom:10px}
.pill-bar{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:20px}
.pill-bar::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;padding:3px 10px;border-radius:20px;font-size:11px;border:1px solid var(--border);color:var(--muted);background:var(--surface);max-width:85px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:all .3s;cursor:pointer}
.pill.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;font-weight:700}
.pill.done{color:var(--muted);background:var(--surface2)}
.pill.skipped{background:#2a1a0a;border-color:#5a3a10;color:#f0a060}
/* Welcome */
.welcome{animation:fadeIn .5s ease;display:flex;flex-direction:column;gap:20px}
.hero-bg{position:relative;border-radius:20px;overflow:hidden;padding:52px 16px 44px;text-align:center;margin-bottom:4px;}

.workout-selector{display:flex;flex-direction:column;gap:14px}

.workout-btn:active{transform:scale(.98)}
.workout-btn.wb{border-color:#2a1a0a}
.wb-title{font-family:var(--fd);font-size:28px;background:linear-gradient(135deg,var(--accent),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px;margin-bottom:4px}
.workout-btn.wb .wb-title{background:linear-gradient(135deg,var(--accent2),#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.wb-sub{color:var(--text);font-size:14px;font-weight:600;margin-bottom:6px}
.wb-detail{color:var(--muted);font-size:12px;line-height:1.5}
.hist-badge{background:#0a1628;border:1px solid #1e3a5f;border-radius:10px;padding:5px 12px;font-size:11px;color:var(--accent2);display:inline-flex;align-items:center;gap:4px}
.hist-nav-btn{background:var(--surface2);border:1px solid #1e3a5f;border-radius:12px;color:var(--muted);padding:14px;font-size:14px;cursor:pointer;font-family:var(--fb);width:100%;text-align:center}
.safety-note{background:#1a0a00;border:1px solid #5a3010;border-radius:12px;padding:14px;font-size:12px;color:#fbbf24;line-height:1.8}
/* Resume */
.resume-screen{display:flex;flex-direction:column;gap:16px;padding:40px 0;animation:fadeIn .4s ease}
.resume-title{font-family:var(--fd);font-size:42px;color:var(--accent2);text-align:center;letter-spacing:2px}
.resume-info{background:var(--surface2);border:1px solid #1e3a5f;border-radius:14px;padding:16px;text-align:center;font-size:15px;line-height:1.7;color:var(--muted)}

.resume-discard-btn{background:transparent;border:1px solid var(--border);border-radius:12px;color:var(--muted);padding:14px;font-size:14px;cursor:pointer;font-family:var(--fb);text-align:center;width:100%}

.overview{animation:fadeIn .4s ease;display:flex;flex-direction:column;gap:16px}
.ov-header{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.ov-title{font-family:var(--fd);font-size:38px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px}

.ov-section-title.warmup{color:var(--accent2)}

.ov-ex-name{font-size:13px;font-weight:700;color:var(--text);margin-bottom:2px}
.ov-ex-muscle{font-size:11px;color:var(--accent);margin-top:2px}

.ov-field{display:flex;flex-direction:column;gap:4px}
.ov-field-label{font-size:11px;color:var(--accent);font-weight:600}
.ov-field-prev{font-size:10px;color:var(--muted);margin-bottom:2px}
.ov-input{background:#060d1a;border:1px solid var(--accent);border-radius:8px;color:var(--text);font-size:16px;font-weight:700;text-align:center;padding:6px 4px;font-family:var(--fb);width:100%}
.ov-time-row{padding:8px 12px 10px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}

.save-plan-btn{background:var(--surface2);border:1px solid var(--accent3);border-radius:12px;color:var(--accent3);padding:14px;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--fb);width:100%;text-align:center}

.exercise-screen{animation:slideUp .4s ease;display:flex;flex-direction:column;gap:16px}

.ex-name{font-family:var(--fd);font-size:clamp(24px,6vw,38px);letter-spacing:2px;line-height:1.1;text-align:center;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-top:2px}

.slide{position:absolute;inset:0;opacity:0;transition:opacity .4s ease}
.slide.active{opacity:1;z-index:1}
.slide img{width:100%;height:100%;object-fit:cover;display:block}

.slide-muscle{position:absolute;top:10px;left:10px;z-index:3;background:#00000099;border:1px solid #3b82f655;border-radius:20px;padding:4px 12px;font-size:11px;color:var(--accent)}
.slide-counter{position:absolute;top:10px;right:10px;z-index:3;background:#00000099;border-radius:20px;padding:4px 10px;font-size:11px;color:#fff}

.slide-nav.prev{left:8px}.slide-nav.next{right:8px}
.slide-dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:3}
.slide-dot{width:6px;height:6px;border-radius:50%;background:#ffffff44;cursor:pointer;transition:all .25s}
.slide-dot.active{background:var(--accent);width:18px;border-radius:3px}
.slide-icon{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:72px;animation:float 3s ease-in-out infinite}
/* Edit row */
.edit-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;background:var(--surface2);border:1px solid #1e3a5f;border-radius:12px;padding:12px}
.edit-box{display:flex;flex-direction:column;gap:4px;align-items:center}
.edit-lbl{font-size:10px;color:var(--accent);font-weight:600;text-align:center}
.edit-inp{background:#060d1a;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:17px;font-weight:700;text-align:center;padding:6px 2px;font-family:var(--fb);width:100%}
.edit-inp:focus{border-color:var(--accent);outline:none}
.edit-unit{font-size:10px;color:var(--muted)}
/* Reps box */
.reps-box{background:var(--surface2);border-radius:14px;padding:16px 24px;text-align:center;border:1px solid var(--border)}
.reps-num{font-family:var(--fd);font-size:48px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:block;line-height:1}
.reps-label{color:var(--muted);font-size:13px;margin-top:4px;display:block}
.sets-track{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.set-bar{height:8px;border-radius:4px;transition:all .35s ease}
.set-done{background:var(--accent)}.set-current{background:var(--accent2);box-shadow:0 0 10px #fb923c88}.set-pending{background:var(--border)}
.set-label{color:var(--muted);font-size:12px;margin-top:8px;text-align:center}
.timed-ex-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0}
.timed-start-btn{background:linear-gradient(135deg,var(--accent),var(--accent3));color:#fff;border:none;border-radius:14px;padding:16px 32px;font-size:18px;font-weight:700;cursor:pointer;font-family:var(--fb);min-width:160px}
/* Tip */
.tip{background:#0a1628;border:1px solid #1e3a5f;border-radius:12px;padding:12px 16px;display:flex;gap:10px;align-items:flex-start}
.tip p{font-size:13px;color:#90c4f0;line-height:1.6}
.yt-link{display:flex;align-items:center;justify-content:center;gap:8px;background:#1a0a00;border:1px solid #3a2010;border-radius:12px;padding:12px 16px;color:var(--accent2);text-decoration:none;font-size:14px;font-weight:500}
/* Buttons */
.btn-main{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:14px;padding:20px;font-size:20px;font-weight:700;cursor:pointer;font-family:var(--fb);letter-spacing:1px;box-shadow:0 0 32px #3b82f655;animation:glow 2s ease-in-out infinite;width:100%;transition:transform .1s}
.btn-main:active{transform:scale(.97)}
.sec-btn-row{display:flex;flex-direction:column;gap:8px}
.set-ctrl-row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 14px}
.btn-add-set{background:#0a1e10;border:1px solid #1a5030;border-radius:10px;color:#4ade80;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--fb)}
.btn-remove-set{background:#1a0a0a;border:1px solid #4a1010;border-radius:10px;color:#f87171;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--fb)}
.btn-remove-set:disabled{opacity:.3}
.set-ctrl-count{font-size:13px;color:var(--muted);font-weight:600}
.btn-early{background:#1a2010;border:1px solid #3a5020;border-radius:12px;color:#86efac;padding:12px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--fb);text-align:center;width:100%}
.btn-skip{background:#0a1628;border:1px solid #1e3a5f;border-radius:12px;color:var(--muted);padding:12px 16px;font-size:14px;cursor:pointer;font-family:var(--fb);text-align:center;width:100%}
.btn-prev-ex{background:#060d1a;border:1px solid var(--border);border-radius:12px;color:var(--muted);padding:10px 16px;font-size:13px;cursor:pointer;font-family:var(--fb);text-align:center;width:100%}
.skipped-banner{background:#2a1a0a;border:1px solid #5a3a10;border-radius:10px;padding:8px 14px;font-size:13px;color:#f0a060;text-align:center}
.skipped-card{background:var(--surface2);border:1px solid #5a3a10;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.skipped-card-name{font-size:16px;font-weight:700;color:#f0a060}
/* Rest */
.rest-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 0}
.rest-label{color:var(--muted);font-size:14px;font-weight:500;text-align:center;line-height:1.5}
.timer-ring{position:relative;width:140px;height:140px}
.timer-svg{transform:rotate(-90deg)}
.timer-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer-num{font-family:var(--fd);font-size:42px;line-height:1}
.timer-sec{font-size:11px;color:var(--muted);margin-top:2px}
.skip-btn{background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--muted);padding:10px 24px;font-size:13px;cursor:pointer;font-family:var(--fb)}
/* Summary */
.summary-screen{animation:fadeIn .5s ease;display:flex;flex-direction:column;gap:14px}
.sum-title{font-family:var(--fd);font-size:40px;text-align:center;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px}
.sum-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum-stat{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}
.sum-stat-val{font-family:var(--fd);font-size:32px;color:var(--accent);display:block}
.sum-stat-lbl{font-size:11px;color:var(--muted);margin-top:2px}
.sum-table{background:var(--surface2);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.sum-ex-header{background:#0a1628;padding:10px 14px;border-bottom:1px solid var(--border)}
.sum-ex-name{font-size:13px;font-weight:700;color:var(--accent)}
.sum-skip-row{padding:8px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border)}
.sum-set-row{display:grid;grid-template-columns:.5fr 1fr 1fr 1fr;gap:4px;padding:8px 14px;border-bottom:1px solid var(--border);font-size:12px;align-items:center}
.sum-set-row:last-child{border-bottom:none}
.sum-set-row.header{background:#060d1a;font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.5px}
.num-col{text-align:center;color:var(--accent2);font-weight:600}
.manual-save-btn{background:linear-gradient(135deg,var(--accent),var(--accent3));color:#fff;border:none;border-radius:12px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;font-family:var(--fb);width:100%;text-align:center}
.sum-copy{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;cursor:pointer;color:var(--accent);font-size:14px;font-weight:600}
.done-text{color:var(--muted);font-size:15px;line-height:1.8;max-width:290px;margin:0 auto}
.btn-secondary{background:var(--surface2);border:1px solid var(--border);border-radius:12px;color:var(--text);padding:14px 32px;font-size:15px;cursor:pointer;font-family:var(--fb);width:100%}
/* History */
.history-screen{animation:fadeIn .4s ease;display:flex;flex-direction:column;gap:14px}
.hist-screen-title{font-family:var(--fd);font-size:36px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px;text-align:center}
.io-row{display:flex;gap:10px}
.io-btn{flex:1;border-radius:12px;padding:12px;font-size:13px;font-weight:600;cursor:pointer;text-align:center;font-family:var(--fb);border:1px solid var(--border)}
.export-btn{background:var(--surface2);color:var(--accent);border-color:#1e3a5f}
.hist-tabs{display:flex;gap:8px;background:var(--surface2);border-radius:12px;padding:4px}
.hist-tab{flex:1;border:none;border-radius:9px;padding:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--fb);background:transparent;color:var(--muted);transition:all .2s}
.hist-tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.hist-content{display:flex;flex-direction:column;gap:12px}
.hist-empty{text-align:center;color:var(--muted);padding:32px;font-size:14px}
.hist-summary-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.hist-summary-stat{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
.hist-stat-val{font-family:var(--fd);font-size:26px;color:var(--accent);line-height:1}
.hist-stat-lbl{font-size:10px;color:var(--muted);margin-top:3px}
.hist-section-title{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:1px;margin-top:4px}
.chart-card{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:12px;overflow:hidden}
.chart-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:8px}
.chart-note{font-size:12px;color:var(--muted);padding:8px 0}
.chart-badge{font-size:12px;font-weight:600;margin-top:8px;padding:4px 10px;border-radius:20px;display:inline-block}
.chart-badge.up{background:#0a1e10;color:#4ade80;border:1px solid #1a5030}
.sess-card{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.sess-hdr{display:flex;justify-content:space-between;align-items:center}
.sess-date{font-size:13px;font-weight:700;color:var(--text)}
.sess-dur{font-size:12px;color:var(--accent2)}
.sess-ex-row{border-top:1px solid var(--border);padding-top:7px}
.sess-ex-name{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:4px}
.sess-sets{display:flex;flex-wrap:wrap;gap:5px}
.sess-set{background:#060d1a;border:1px solid var(--border);border-radius:8px;padding:3px 8px;font-size:11px;color:var(--muted)}

</style>

<div class="orb1"></div><div class="orb2"></div>

let WORKOUT=WA, currentWorkoutNum=1;
let exIdx=0, setsDone=0, timerInterval=null, curSlide=0, slideTimer=null;
let workoutStartTime=null, setStartTime=null, lastRestStart=null;

let skippedQueue=[];

// ── Storage ───────────────────────────────────────────────────────────────────
function storageKey(n){ return 'or_w'+n+'_history'; }
function getHistory(n){ try{ return JSON.parse(localStorage.getItem(storageKey(n))||'[]'); }catch(e){ return []; } }
function saveHistory(n,s){ try{ localStorage.setItem(storageKey(n),JSON.stringify(s.slice(-30))); }catch(e){} }
function getLastSession(n){ const h=getHistory(n); return h.length?h[h.length-1]:null; }
function getLastExData(n,name){ const last=getLastSession(n); if(!last)return null; return last.exercises.find(e=>e.name===name)||null; }
function saveSession(n,data){ const h=getHistory(n); h.push(data); saveHistory(n,h); }
function formatTime(s){
  if(s==null||isNaN(s))return '—';
  if(s<60)return s+'ש\'';
  return Math.floor(s/60)+'ד\''+(s%60?' '+s%60+'ש\'':'');
}
function nowSec(){ return Math.floor(Date.now()/1000); }

// Plan storage
function savePlan(n){ try{ localStorage.setItem('or_w'+n+'_plan',JSON.stringify(plannedSets)); }catch(e){} }
function loadPlan(n){ try{ const r=localStorage.getItem('or_w'+n+'_plan'); if(r) Object.assign(plannedSets,JSON.parse(r)); }catch(e){} }

// Custom workout storage
function getEffectiveWorkout(n){
  try{
    const r=localStorage.getItem('or_w'+n+'_custom');
    const c=r?JSON.parse(r):null;
    if(c&&c.length>0) return c;
  }catch(e){}
  return n===1?WA:WB;
}
function saveCustomWorkout(n,w){ try{ localStorage.setItem('or_w'+n+'_custom',JSON.stringify(w)); }catch(e){} }

// Autosave
const AUTOSAVE_KEY='or_workout_autosave';
function autoSaveState(){
  try{
    localStorage.setItem(AUTOSAVE_KEY,JSON.stringify({
      currentWorkoutNum,exIdx,setsDone,workoutStartTime,
      sessionLog:JSON.parse(JSON.stringify(sessionLog)),
      currentExLog:currentExLog?JSON.parse(JSON.stringify(currentExLog)):null,
      plannedSets:JSON.parse(JSON.stringify(plannedSets)),
      skippedQueue:[...skippedQueue],savedAt:Date.now()
    }));
  }catch(e){}
}
function loadAutoSave(){
  try{
    const r=localStorage.getItem(AUTOSAVE_KEY);
    if(!r) return null;
    const s=JSON.parse(r);
    if(Date.now()-s.savedAt>24*60*60*1000){ localStorage.removeItem(AUTOSAVE_KEY); return null; }
    return s;
  }catch(e){ return null; }
}
function clearAutoSave(){ try{ localStorage.removeItem(AUTOSAVE_KEY); }catch(e){} }

// ── Audio + vibrate ───────────────────────────────────────────────────────────
function beepAndVibrate(){
  if(navigator.vibrate)navigator.vibrate([300,100,300,100,300]);
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [0,0.4,0.8].forEach(t=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);o.frequency.value=880;
      g.gain.setValueAtTime(0.3,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.3);
      o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+0.3);
    });
  }catch(e){}
}

// ── DOM helpers ───────────────────────────────────────────────────────────────
function el(tag,cls){ const e=document.createElement(tag); if(cls)e.className=cls; return e; }
function setScreen(node){ const s=document.getElementById('screen'); s.innerHTML=''; s.appendChild(node); }
function ytLink(q){ return 'https://www.youtube.com/results?search_query='+encodeURIComponent(q); }
function typeStyle(t){
  if(t==='warmup')   return{bg:'linear-gradient(135deg,#fb923c,#f97316)',color:'#fff'};
  if(t==='exercise') return{bg:'linear-gradient(135deg,#3b82f6,#06b6d4)',color:'#fff'};
  return{bg:'linear-gradient(135deg,#22c55e,#16a34a)',color:'#fff'};
}
function typeLabel(t){ return t==='warmup'?'🔥 חימום':t==='exercise'?'💪 אימון':'🧊 קירור'; }

// ── Slider ────────────────────────────────────────────────────────────────────
function stopSlideTimer(){ if(slideTimer){clearInterval(slideTimer);slideTimer=null;} }
function goToSlide(n){
  const slides=document.querySelectorAll('.slide'),dots=document.querySelectorAll('.slide-dot');
  const ctr=document.getElementById('slide-counter');
  if(!slides.length)return;
  const total=slides.length;
  curSlide=((n%total)+total)%total;
  slides.forEach((e,i)=>e.classList.toggle('active',i===curSlide));
  dots.forEach((e,i)=>e.classList.toggle('active',i===curSlide));
  if(ctr)ctr.textContent=(curSlide+1)+' / '+total;
}
function prevSlide(){ stopSlideTimer();goToSlide(curSlide-1);startSlideTimer(); }
function nextSlide(){ stopSlideTimer();goToSlide(curSlide+1);startSlideTimer(); }
function startSlideTimer(){ stopSlideTimer(); slideTimer=setInterval(()=>goToSlide(curSlide+1),3000); }

function buildSlider(ex){
  const wrap=el('div','photo-slider');
  if(!ex.slides||!ex.slides.length){
    const ico=el('div','slide-icon');ico.textContent=ex.icon;
    const mus=el('div','slide-muscle');mus.textContent=ex.muscle;
    wrap.append(ico,mus);return wrap;
  }
  ex.slides.forEach((s,i)=>{
    const slide=el('div','slide'+(i===0?' active':''));
    const img=el('img');img.src=s.dataUri||(s.img?IMGS[s.img]||'':'');img.alt='';
    const ov=el('div','slide-overlay');
    const cap=el('div','slide-caption');cap.textContent=s.cap;
    slide.append(img,ov,cap);wrap.appendChild(slide);
  });
  const mus=el('div','slide-muscle');mus.textContent=ex.muscle;
  const ctr=el('div','slide-counter');ctr.id='slide-counter';ctr.textContent='1 / '+ex.slides.length;
  const prev=el('button','slide-nav prev');prev.textContent='‹';prev.onclick=prevSlide;
  const next=el('button','slide-nav next');next.textContent='›';next.onclick=nextSlide;
  const dots=el('div','slide-dots');
  ex.slides.forEach((_,i)=>{ const d=el('div','slide-dot'+(i===0?' active':''));d.onclick=()=>{ stopSlideTimer();goToSlide(i);startSlideTimer(); };dots.appendChild(d); });
  wrap.append(mus,ctr,prev,next,dots);return wrap;
}

// ── Workout timer ─────────────────────────────────────────────────────────────
function startWorkoutTimer(){
  stopWorkoutTimer();
  const el2=document.getElementById('workoutTimer');
  if(el2)el2.classList.add('visible');
  workoutTimerInterval=setInterval(updateWorkoutTimer,1000);
  updateWorkoutTimer();
}
function stopWorkoutTimer(){
  if(workoutTimerInterval){clearInterval(workoutTimerInterval);workoutTimerInterval=null;}
  const el2=document.getElementById('workoutTimer');
  if(el2)el2.classList.remove('visible');
}
function updateWorkoutTimer(){
  if(!workoutStartTime)return;
  const el2=document.getElementById('workoutTimer');
  if(!el2)return;
  const elapsed=nowSec()-workoutStartTime;
  const m=Math.floor(elapsed/60),s=elapsed%60;
  el2.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

// ── Progress ──────────────────────────────────────────────────────────────────
function initPlannedSets(wNum,ex){
  if(ex.track==='time'||ex.track==='timed'){
    plannedSets[ex.name]={rest:ex.defaultRest,sets:[{reps:ex.defaultReps,weight:0}]};return;
  }
  const last=getLastExData(wNum,ex.name);
  if(last&&last.setDetails&&last.setDetails.length){
    plannedSets[ex.name]={rest:last.rest||ex.defaultRest,sets:last.setDetails.map(s=>({reps:s.reps||ex.defaultReps,weight:s.weight!=null?s.weight:0}))};
  } else {
    const sets=[];for(let i=0;i<ex.defaultSets;i++)sets.push({reps:ex.defaultReps,weight:0});
    plannedSets[ex.name]={rest:ex.defaultRest,sets};
  }
}

function updateProgress(){
  document.getElementById('progressFill').style.width=(exIdx/WORKOUT.length*100)+'%';
  document.getElementById('progressText').textContent=exIdx+' / '+WORKOUT.length+' תרגילים'+(skippedQueue.length?' • ⏭ '+skippedQueue.length+' ממתינים':'');
  const bar=document.getElementById('pillBar');bar.innerHTML='';
  WORKOUT.forEach((e,i)=>{
    const skipped=skippedQueue.includes(i);
    const p=el('div','pill'+(i===exIdx?' active':i<exIdx?' done':skipped?' skipped':''));
    p.title=e.name;p.textContent=(i<exIdx?'✓':skipped?'⏭':(i+1)+'.')+' '+e.name;
    bar.appendChild(p);
  });
}

// ── Navigation ────────────────────────────────────────────────────────────────
function handleBack(){
  stopSlideTimer();clearInterval(timerInterval);
  if(appScreen==='overview')renderWelcome();
  else if(appScreen==='exercise'||appScreen==='rest'){
    if(sessionLog.length>0||currentExLog){
      if(!confirm('לחזור? האימון יישמר ב-autosave.'))return;
    }
    renderOverview(currentWorkoutNum,true);
  }
  else if(appScreen==='summary')renderWelcome();
  else if(appScreen==='history')renderWelcome();
  else renderWelcome();
}

// ── Exercise ──────────────────────────────────────────────────────────────────
function renderExercise(){
  appScreen='exercise';
  stopSlideTimer();clearInterval(timerInterval);
  const e=WORKOUT[exIdx];
  const ps=plannedSets[e.name]||{rest:e.defaultRest,sets:[{reps:e.defaultReps,weight:0}]};
  const totalSets=ps.sets.length;
  const isLastSet=setsDone+1>=totalSets;
  const currentSet=ps.sets[setsDone]||ps.sets[ps.sets.length-1];
  const s=typeStyle(e.type);
  curSlide=0; setStartTime=nowSec();

  if(setsDone===0) currentExLog={name:e.name,rest:ps.rest,plannedSets:totalSets,sets:[],setDetails:[]};

  const wrap=el('div','exercise-screen');
  const badge=el('div','badge');
  const bspan=el('span');bspan.style.background=s.bg;bspan.style.color=s.color;bspan.textContent=typeLabel(e.type);badge.appendChild(bspan);
  const name=el('div','ex-name');name.textContent=e.name;
  wrap.append(badge,name,buildSlider(e));

  const isTimedEx=(e.track==='timed'||e.track==='time');

  if(e.track===true){
    const editRow=el('div','edit-row');
    [{id:'live-weight',lbl:'⚖️ משקל',key:'weight',val:currentSet.weight,unit:'ק"ג',step:'0.5',min:'0'},
     {id:'live-reps',lbl:'🔁 חזרות',key:'reps',val:currentSet.reps,unit:'',step:'1',min:'1'},
     {id:'live-rest',lbl:'💤 מנוחה',key:'rest',val:ps.rest,unit:'ש\'',step:'5',min:'0'},
    ].forEach(({id,lbl,key,val,unit,step,min})=>{
      const box=el('div','edit-box');
      const lb=el('div','edit-lbl');lb.textContent=lbl;
      const inp=el('input','edit-inp');inp.id=id;inp.type='number';inp.min=min;inp.step=step;inp.value=val||'';
      inp.oninput=()=>{
        const v=parseFloat(inp.value)||0;
        if(key==='rest') ps.rest=v;
        else if(ps.sets[setsDone]) ps.sets[setsDone][key]=v;
        if(key==='reps'){const rd=document.getElementById('reps-display');if(rd)rd.textContent=v;}
      };
      if(unit){const u=el('div','edit-unit');u.textContent=unit;box.append(lb,inp,u);}
      else{box.append(lb,inp);}
      editRow.appendChild(box);
    });
    wrap.appendChild(editRow);
  }

  const rbox=el('div','reps-box');
  if(totalSets>1){
    const track=el('div','sets-track');
    for(let i=0;i<totalSets;i++){
      const b=el('div','set-bar '+(i<setsDone?'set-done':i===setsDone?'set-current':'set-pending'));
      b.style.width=(i<setsDone?36:i===setsDone?28:22)+'px';track.appendChild(b);
    }
    const slbl=el('div','set-label');slbl.textContent='סט '+(setsDone+1)+' מתוך '+totalSets;rbox.append(track,slbl);
  }

  if(isTimedEx){
    const timedDur=currentSet?currentSet.reps:e.defaultReps;
    const timedUnit=e.repsUnit||'שניות';
    const R=54,Circ=2*Math.PI*R;
    let timedT=timedUnit==='דקות'?timedDur*60:timedDur;
    const totalT=timedT;
    let timedRunning=false;
    const timedWrap=el('div','timed-ex-wrap');
    const timedInfo=el('div','rest-label');timedInfo.textContent='⏱ '+timedDur+' '+timedUnit;
    const ring=el('div','timer-ring');
    ring.innerHTML=`<svg width="140" height="140" class="timer-svg">
      <circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--border)" stroke-width="8"/>
      <circle id="exTimerCirc" cx="70" cy="70" r="${R}" fill="none" stroke="var(--accent)" stroke-width="8"
        stroke-dasharray="${Circ} ${Circ}" stroke-linecap="round" style="transition:stroke-dasharray .5s linear"/>
    </svg>
    <div class="timer-center">
      <span class="timer-num" id="exTimerNum" style="color:var(--accent)">${timedUnit==='דקות'?timedDur:timedT}</span>
      <span class="timer-sec">${timedUnit}</span>
    </div>`;
    const startPauseBtn=el('button','timed-start-btn');startPauseBtn.textContent='▶ התחל';
    let exInt=null;
    startPauseBtn.onclick=()=>{
      if(!timedRunning){
        timedRunning=true;startPauseBtn.textContent='⏸ השהה';
        exInt=setInterval(()=>{
          timedT--;
          const en=document.getElementById('exTimerNum'),ec=document.getElementById('exTimerCirc');
          if(!en){clearInterval(exInt);return;}
          const disp=timedUnit==='דקות'?Math.ceil(timedT/60):timedT;
          if(timedT<=0){clearInterval(exInt);timedRunning=false;en.textContent='0';ec.style.strokeDasharray='0 '+Circ;beepAndVibrate();startPauseBtn.textContent='✓ סיימתי';startPauseBtn.onclick=handleAction;return;}
          en.textContent=disp;ec.style.strokeDasharray=(Circ*(timedT/totalT))+' '+Circ;
        },1000);
      } else {timedRunning=false;startPauseBtn.textContent='▶ המשך';clearInterval(exInt);}
    };
    timedWrap.append(timedInfo,ring,startPauseBtn);
    rbox.appendChild(timedWrap);
  } else {
    const rnum=el('span','reps-num');rnum.id='reps-display';
    rnum.textContent=String(currentSet?currentSet.reps:e.defaultReps);
    rbox.appendChild(rnum);
    if(!e.repsUnit){const rl=el('span','reps-label');rl.textContent='חזרות';rbox.appendChild(rl);}
  }

  const tip=el('div','tip');
  const tipico=el('span');tipico.style.fontSize='18px';tipico.style.flexShrink='0';tipico.textContent='💡';
  const tipp=el('p');tipp.textContent=e.tips;
  tip.append(tipico,tipp);
  const yt=el('a','yt-link');yt.href=ytLink(e.yt);yt.target='_blank';yt.textContent='▶ צפה בסרטון הדרכה';

  const btnDone=el('button','btn-main');
  btnDone.style.cssText='background:'+s.bg+';color:'+s.color+';box-shadow:none;animation:none;';
  btnDone.textContent=isTimedEx?'✓ סיימתי':isLastSet?'✓ סיימתי את התרגיל':'✓ סיימתי את הסט';
  if(!isTimedEx) btnDone.onclick=handleAction;

  const secRow=el('div','sec-btn-row');
  if(e.type==='exercise'&&!isTimedEx&&totalSets>1){
    const setCtrl=el('div','set-ctrl-row');
    const addBtn=el('button','btn-add-set');addBtn.textContent='+ סט';
    addBtn.onclick=()=>{const last=ps.sets[ps.sets.length-1]||{reps:e.defaultReps,weight:0};ps.sets.push({reps:last.reps,weight:last.weight});if(currentExLog)currentExLog.plannedSets=ps.sets.length;renderExercise();};
    const remBtn=el('button','btn-remove-set');remBtn.textContent='− סט';remBtn.disabled=ps.sets.length<=1||(setsDone>=ps.sets.length-1);
    remBtn.onclick=()=>{if(ps.sets.length<=1||setsDone>=ps.sets.length-1)return;ps.sets.pop();if(currentExLog)currentExLog.plannedSets=ps.sets.length;renderExercise();};
    const cnt=el('div','set-ctrl-count');cnt.textContent='סה"כ: '+totalSets;
    setCtrl.append(remBtn,cnt,addBtn);secRow.appendChild(setCtrl);
  }
  if(e.type==='exercise'&&totalSets>1&&setsDone>0&&!isLastSet){
    const btnEarly=el('button','btn-early');btnEarly.textContent='🏁 סיים מוקדם ('+setsDone+' סטים)';
    btnEarly.onclick=finishEarly;secRow.appendChild(btnEarly);
  }
  if(e.type==='exercise'){
    const btnSkip=el('button','btn-skip');btnSkip.textContent='⏭ מתקן תפוס — דלג';
    btnSkip.onclick=skipExercise;secRow.appendChild(btnSkip);
  }
  if(exIdx>0&&setsDone===0){
    const btnPrev=el('button','btn-prev-ex');btnPrev.textContent='← חזור: '+WORKOUT[exIdx-1].name;
    btnPrev.onclick=goBackExercise;secRow.appendChild(btnPrev);
  }

  wrap.append(rbox,tip,yt,btnDone,secRow);
  setScreen(wrap);
  if(e.slides&&e.slides.length>1)startSlideTimer();
}

// ── Actions ───────────────────────────────────────────────────────────────────
function handleAction(){
  const e=WORKOUT[exIdx];
  const ps=plannedSets[e.name]||{rest:e.defaultRest,sets:[{reps:e.defaultReps,weight:0}]};
  const isLast=setsDone+1>=ps.sets.length;
  const setTime=setStartTime?Math.max(1,nowSec()-setStartTime):0;
  const currentSet=ps.sets[setsDone]||{reps:e.defaultReps,weight:0};
  if(currentExLog){
    currentExLog.sets.push({setTime});
    currentExLog.setDetails.push({reps:currentSet.reps||e.defaultReps,weight:currentSet.weight||0,setTime});
  }
  try{ localStorage.setItem('or_w'+currentWorkoutNum+'_plan',JSON.stringify(plannedSets)); }catch(err){}
  autoSaveState();
  if(isLast){ ps.rest>0?startRest(ps.rest,true,false):finishExercise(); }
  else{ startRest(ps.rest,false,false); }
}

function skipExercise(){
  stopSlideTimer();clearInterval(timerInterval);
  if(!skippedQueue.includes(exIdx))skippedQueue.push(exIdx);
  if(currentExLog){currentExLog.skipped=true;sessionLog.push(currentExLog);currentExLog=null;}
  setsDone=0;autoSaveState();advanceToNext();
}

function finishEarly(){
  stopSlideTimer();clearInterval(timerInterval);
  const e=WORKOUT[exIdx];
  const ps=plannedSets[e.name]||{rest:e.defaultRest};
  if(currentExLog){currentExLog.earlyFinish=true;currentExLog.actualSets=setsDone;sessionLog.push(currentExLog);currentExLog=null;}
  setsDone=0;
  if(ps.rest>0)startRest(ps.rest,true,true); else advanceToNext();
}

function finishExercise(){
  if(currentExLog){sessionLog.push(currentExLog);currentExLog=null;}
  const qi=skippedQueue.indexOf(exIdx);if(qi>=0)skippedQueue.splice(qi,1);
  setsDone=0;
  try{ localStorage.setItem('or_w'+currentWorkoutNum+'_plan',JSON.stringify(plannedSets)); }catch(e){}
  autoSaveState();advanceToNext();
}

function goBackExercise(){
  if(exIdx<=0)return;
  if(currentExLog&&currentExLog.sets&&currentExLog.sets.length>0)sessionLog.push(currentExLog);
  currentExLog=null;setsDone=0;exIdx--;
  const prevName=WORKOUT[exIdx].name;
  const li=sessionLog.map(e=>e.name).lastIndexOf(prevName);
  if(li>=0)sessionLog.splice(li,1);
  const qi=skippedQueue.indexOf(exIdx);if(qi>=0)skippedQueue.splice(qi,1);
  updateProgress();renderExercise();
}

function advanceToNext(){
  exIdx++;setsDone=0;
  if(exIdx>=WORKOUT.length){
    if(skippedQueue.length>0)showSkippedPrompt();
    else renderSummary();
  } else { updateProgress();renderExercise(); }
}

function showSkippedPrompt(){
  appScreen='exercise';
  const wrap=el('div','exercise-screen');
  const t=el('div','ex-name');t.style.fontSize='22px';t.textContent='⏭ תרגילים שדולגו';
  const inf=el('div','tip');
  const ic=el('span');ic.style.fontSize='18px';ic.style.flexShrink='0';ic.textContent='💡';
  const tx=el('p');tx.textContent='יש '+skippedQueue.length+' תרגילים שדולגו. לחזור אליהם?';
  inf.append(ic,tx);wrap.append(t,inf);
  skippedQueue.forEach((idx,qi)=>{
    const e=WORKOUT[idx];
    const card=el('div','skipped-card');
    const cn=el('div','skipped-card-name');cn.textContent=e.icon+' '+e.name;
    const bd=el('button','btn-main');bd.style.cssText='padding:12px;font-size:15px;box-shadow:none;animation:none;';bd.textContent='✓ בצע עכשיו';
    bd.onclick=(()=>{ const i=idx,q=qi; return ()=>{ skippedQueue.splice(q,1);exIdx=i;setsDone=0;updateProgress();renderExercise(); }; })();
    const ba=el('button','btn-skip');ba.textContent='✗ ויתרתי';
    ba.onclick=(()=>{ const i=idx,q=qi; return ()=>{ skippedQueue.splice(q,1);sessionLog.push({name:WORKOUT[i].name,weight:0,reps:0,rest:0,plannedSets:WORKOUT[i].defaultSets,sets:[],setDetails:[],skipped:true,abandoned:true});if(skippedQueue.length===0)renderSummary();else showSkippedPrompt(); }; })();
    card.append(cn,bd,ba);wrap.appendChild(card);
  });
  const be=el('button','btn-secondary');be.textContent='סיים אימון →';be.onclick=renderSummary;be.style.marginTop='8px';
  wrap.appendChild(be);setScreen(wrap);
}

// ── Rest ──────────────────────────────────────────────────────────────────────
function startRest(seconds,isLastSet,isEarlyFinish){
  appScreen='rest';
  stopSlideTimer();clearInterval(timerInterval);
  const e=WORKOUT[exIdx];const s=typeStyle(e.type);
  let t=seconds;const R=54,Circ=2*Math.PI*R;
  lastRestStart=nowSec();
  const wrap=el('div','exercise-screen');
  const badge=el('div','badge');
  const bspan=el('span');bspan.style.background=s.bg;bspan.style.color=s.color;bspan.textContent=typeLabel(e.type);badge.appendChild(bspan);
  const name=el('div','ex-name');name.textContent=e.name;
  const rw=el('div','rest-wrap');
  const rl=el('div','rest-label');
  if(isEarlyFinish)rl.innerHTML='🏁 סיום מוקדם<br>מנוחה לפני הבא';
  else rl.innerHTML=isLastSet?'✅ תרגיל הסתיים!<br>מנוחה לפני הבא':'💤 מנוחה — '+seconds+' שניות';
  const ring=el('div','timer-ring');
  ring.innerHTML=`<svg width="140" height="140" class="timer-svg">
    <circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--border)" stroke-width="8"/>
    <circle id="timerCirc" cx="70" cy="70" r="${R}" fill="none" stroke="var(--accent)" stroke-width="8"
      stroke-dasharray="${Circ} ${Circ}" stroke-linecap="round" style="transition:stroke-dasharray .5s linear,stroke .3s"/>
  </svg>
  <div class="timer-center">
    <span class="timer-num" id="timerNum" style="color:var(--accent)">${t}</span>
    <span class="timer-sec">שניות</span>
  </div>`;
  const skip=el('button','skip-btn');skip.textContent='דלג על המנוחה ←';skip.onclick=()=>skipRest(isLastSet,isEarlyFinish,seconds-t);
  rw.append(rl,ring,skip);wrap.append(badge,name,rw);setScreen(wrap);
  timerInterval=setInterval(()=>{
    t--;
    const elNum=document.getElementById('timerNum'),elCirc=document.getElementById('timerCirc');
    if(!elNum){clearInterval(timerInterval);return;}
    const urgent=t<=10,color=urgent?'var(--accent2)':'var(--accent)';
    elNum.textContent=t;elNum.style.color=color;
    elNum.style.animation=urgent?'tick .5s ease-in-out infinite':'none';
    elCirc.style.stroke=color;elCirc.style.strokeDasharray=(Circ*(t/seconds))+' '+Circ;
    if(t<=0){clearInterval(timerInterval);beepAndVibrate();setTimeout(()=>skipRest(isLastSet,isEarlyFinish,seconds),600);}
  },1000);
}

function skipRest(isLastSet,isEarlyFinish,restDone){
  clearInterval(timerInterval);
  const actual=restDone!=null?restDone:nowSec()-(lastRestStart||nowSec());
  if(currentExLog&&currentExLog.sets.length)currentExLog.sets[currentExLog.sets.length-1].restTime=actual;
  if(isEarlyFinish||isLastSet)finishExercise();else{setsDone++;renderExercise();}
}

// ── Summary ───────────────────────────────────────────────────────────────────
function renderSummary(){
  appScreen='summary';
  stopSlideTimer();stopWorkoutTimer();beepAndVibrate();
  document.getElementById('progressArea').style.display='none';
  document.getElementById('backBtn').style.display='block';
  const totalTime=nowSec()-(workoutStartTime||nowSec());

  const sessionData={
    date:new Date().toISOString(),
    workoutNum:currentWorkoutNum,
    totalTime,
    exercises:sessionLog.map(e=>({
      name:e.name,rest:e.rest||0,sets:e.sets?e.sets.length:0,plannedSets:e.plannedSets||3,
      skipped:e.skipped||false,earlyFinish:e.earlyFinish||false,
      setDetails:e.setDetails||[],weight:e.setDetails&&e.setDetails.length?e.setDetails[0].weight:0,
      reps:e.setDetails&&e.setDetails.length?e.setDetails[0].reps:0,
      avgSetTime:e.sets&&e.sets.length?Math.round(e.sets.reduce((a,s)=>a+(s.setTime||0),0)/e.sets.length):0,
    }))
  };
  saveSession(currentWorkoutNum,sessionData);
  try{ localStorage.setItem('or_w'+currentWorkoutNum+'_plan',JSON.stringify(plannedSets)); }catch(e){}
  clearAutoSave();

  const wrap=el('div','summary-screen');
  const trophy=el('div');trophy.textContent='🏆';trophy.style.cssText='font-size:64px;text-align:center;animation:float 2s ease-in-out infinite';
  const st=el('div','sum-title');st.textContent='אימון '+(currentWorkoutNum===1?'A':'B')+' הושלם!';

  const stats=el('div','sum-stats');
  [[formatTime(totalTime),'זמן כולל'],[sessionLog.filter(e=>!e.skipped||!e.abandoned).length,'תרגילים'],
   [sessionLog.filter(e=>e.earlyFinish).length||'—','קוצרו'],
   [sessionLog.filter(e=>e.skipped).length||'—','דולגו']
  ].forEach(([v,l])=>{
    const s=el('div','sum-stat');
    const sv=el('span','sum-stat-val');sv.textContent=v;
    const sl=el('span','sum-stat-lbl');sl.textContent=l;
    s.append(sv,sl);stats.appendChild(s);
  });

  const tbl=el('div','sum-table');
  sessionLog.forEach(e=>{
    const hrow=el('div','sum-ex-header');
    const hn=el('div','sum-ex-name');hn.textContent=e.name+(e.earlyFinish?' ⚡':e.skipped&&e.abandoned?' ⏭':'');
    hrow.appendChild(hn);tbl.appendChild(hrow);
    if(e.skipped&&e.abandoned){const sr=el('div','sum-skip-row');sr.textContent='לא בוצע';tbl.appendChild(sr);return;}
    const sh=el('div','sum-set-row header');
    ['סט','חזרות','משקל','זמן'].forEach(h=>{ const c=el('div');c.textContent=h;sh.appendChild(c); });
    tbl.appendChild(sh);
    (e.setDetails||[]).forEach((sd,i)=>{
      const sr=el('div','sum-set-row');
      [String(i+1),String(sd.reps||'—'),sd.weight?(sd.weight+'ק"ג'):'—',formatTime(sd.setTime)].forEach((v,j)=>{
        const c=el('div',j===0?'':'num-col');c.textContent=v;sr.appendChild(c);
      });
      tbl.appendChild(sr);
    });
  });

  const manualSave=el('button','manual-save-btn');manualSave.textContent='💾 שמור אימון';
  manualSave.onclick=()=>{ try{ saveSession(currentWorkoutNum,sessionData); manualSave.textContent='✅ נשמר!'; manualSave.style.background='#1a2810';manualSave.style.color='#a5d6a7'; }catch(err){ manualSave.textContent='❌ שגיאה'; } };

  const copyBtn=el('div','sum-copy');copyBtn.textContent='📋 העתק סיכום';
  copyBtn.onclick=()=>{
    const lines=['אימון '+(currentWorkoutNum===1?'A':'B')+' — '+new Date().toLocaleDateString('he-IL'),'זמן: '+formatTime(totalTime),''];
    sessionLog.forEach(e=>{ lines.push(e.name);(e.setDetails||[]).forEach((sd,i)=>lines.push('  סט '+(i+1)+': '+(sd.reps||'?')+' × '+(sd.weight?sd.weight+'ק"ג':'גוף'))); });
    const ta=document.createElement('textarea');ta.value=lines.join('\n');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');document.body.removeChild(ta);
    copyBtn.textContent='✅ הועתק!';setTimeout(()=>copyBtn.textContent='📋 העתק סיכום',2000);
  };

  const backBtn2=el('button','btn-secondary');backBtn2.textContent='↩ חזרה לבחירת אימון';backBtn2.onclick=renderWelcome;
  const p=el('p','done-text');p.style.textAlign='center';p.innerHTML='תשתה מים 💧 ותאכל חלבון בשעה הקרובה. כל הכבוד אור! 💪';

  wrap.append(trophy,st,stats,tbl,manualSave,copyBtn,p,backBtn2);
  setScreen(wrap);
}

// ── History ───────────────────────────────────────────────────────────────────
function renderHistoryScreen(){
  appScreen='history';
  stopSlideTimer();clearInterval(timerInterval);
  document.getElementById('backBtn').style.display='block';
  document.getElementById('progressArea').style.display='none';

  const wrap=el('div','history-screen');
  const title=el('div','hist-screen-title');title.textContent='📊 היסטוריה';
  wrap.appendChild(title);

  const exportBtn=el('button','io-btn export-btn');exportBtn.textContent='📥 ייצא נתונים';
  exportBtn.onclick=()=>{
    const data={version:1,exportDate:new Date().toISOString(),w1:getHistory(1),w2:getHistory(2)};
    const uri='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(data,null,2));
    const a=document.createElement('a');a.href=uri;a.download='or_workout_'+new Date().toISOString().slice(0,10)+'.json';a.click();
  };
  const ioRow=el('div','io-row');ioRow.appendChild(exportBtn);wrap.appendChild(ioRow);

  const tabs=el('div','hist-tabs');
  const tab1=el('button','hist-tab active');tab1.textContent='אימון A';tab1.dataset.w='1';
  const tab2=el('button','hist-tab');tab2.textContent='אימון B';tab2.dataset.w='2';
  [tab1,tab2].forEach(t=>t.onclick=()=>{
    document.querySelectorAll('.hist-tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');renderHistContent(wrap,parseInt(t.dataset.w));
  });
  tabs.append(tab1,tab2);wrap.appendChild(tabs);

  const content=el('div','hist-content');content.id='hist-content';wrap.appendChild(content);
  setScreen(wrap);renderHistContent(wrap,1);
}

function renderHistContent(wrap,wNum){
  const content=document.getElementById('hist-content');if(!content)return;
  content.innerHTML='';
  const history=getHistory(wNum);
  if(!history.length){
    const empty=el('div','hist-empty');empty.textContent='עוד אין אימונים מוקלטים';content.appendChild(empty);return;
  }
  const sessions=history.slice().reverse();

  const grid=el('div','hist-summary-grid');
  [[sessions.length,'אימונים'],[formatTime(Math.round(sessions.reduce((a,s)=>a+(s.totalTime||0),0)/sessions.length)),'זמן ממוצע'],[new Date(sessions[0].date).toLocaleDateString('he-IL'),'אחרון']].forEach(([v,l])=>{
    const s=el('div','hist-summary-stat');
    const sv=el('div','hist-stat-val');sv.textContent=v;
    const sl=el('div','hist-stat-lbl');sl.textContent=l;
    s.append(sv,sl);grid.appendChild(s);
  });
  content.appendChild(grid);

  // Charts per exercise
  const exMap={};
  sessions.forEach(session=>{
    const date=new Date(session.date).toLocaleDateString('he-IL');
    (session.exercises||[]).forEach(ex=>{
      if(!ex.setDetails||!ex.setDetails.length)return;
      const maxW=Math.max(...ex.setDetails.map(s=>s.weight||0));
      if(maxW<=0)return;
      if(!exMap[ex.name])exMap[ex.name]=[];
      exMap[ex.name].push({date,maxW,sets:ex.setDetails.length});
    });
  });

  const exKeys=Object.keys(exMap).filter(k=>exMap[k].length>0);
  if(exKeys.length){
    const ct=el('div','hist-section-title');ct.textContent='📈 התקדמות משקל';content.appendChild(ct);
    exKeys.forEach(name=>{
      const data=exMap[name].slice().reverse();
      if(data.length<2)return;
      const card=buildHistChart(name,data);content.appendChild(card);
    });
  }

  const st=el('div','hist-section-title');st.textContent='📋 אימונים';content.appendChild(st);
  sessions.forEach((session,si)=>{
    const card=el('div','sess-card');
    const d=new Date(session.date);
    const hdr=el('div','sess-hdr');
    const dt=el('div','sess-date');dt.textContent=d.toLocaleDateString('he-IL')+' — '+d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
    const dur=el('div','sess-dur');dur.textContent='⏱ '+formatTime(session.totalTime);
    hdr.append(dt,dur);card.appendChild(hdr);
    (session.exercises||[]).forEach(ex=>{
      if(ex.skipped&&ex.abandoned)return;
      const exrow=el('div','sess-ex-row');
      const exname=el('div','sess-ex-name');exname.textContent=ex.name+(ex.earlyFinish?' ⚡':'');
      exrow.appendChild(exname);
      if(ex.setDetails&&ex.setDetails.length){
        const sets=el('div','sess-sets');
        ex.setDetails.forEach((sd,i)=>{
          const s=el('span','sess-set');s.textContent='סט'+(i+1)+': '+(sd.reps||'?')+'×'+(sd.weight?sd.weight+'ק"ג':'גוף');sets.appendChild(s);
        });
        exrow.appendChild(sets);
      }
      card.appendChild(exrow);
    });
    content.appendChild(card);
  });
}

function buildHistChart(name,data){
  const card=el('div','chart-card');
  const title=el('div','chart-title');title.textContent=name;card.appendChild(title);
  if(data.length<2){const n=el('div','chart-note');n.textContent='נדרשים לפחות 2 אימונים';card.appendChild(n);return card;}
  const W=320,H=130,PL=36,PR=12,PT=10,PB=28,IW=W-PL-PR,IH=H-PT-PB;
  const weights=data.map(d=>d.maxW);
  const minW=Math.min(...weights),maxW=Math.max(...weights),range=maxW-minW||1;
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('width','100%');svg.style.display='block';
  function mk(tag,attrs){ const e=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs||{}).forEach(([k,v])=>e.setAttribute(k,v));return e; }
  svg.appendChild(mk('rect',{width:W,height:H,fill:'#0a0f1a',rx:8}));
  [0,0.5,1].forEach(t=>{ const y=PT+IH*(1-t);svg.appendChild(mk('line',{x1:PL,y1:y,x2:W-PR,y2:y,stroke:'#1e3a5f',strokeWidth:1}));const lbl=document.createElementNS('http://www.w3.org/2000/svg','text');lbl.setAttribute('x',PL-4);lbl.setAttribute('y',y+4);lbl.setAttribute('text-anchor','end');lbl.setAttribute('font-size','9');lbl.setAttribute('fill','#4a7ab0');lbl.setAttribute('font-family','Heebo,sans-serif');lbl.textContent=Math.round(minW+range*t);svg.appendChild(lbl); });
  const pts=data.map((d,i)=>({x:PL+(i/(data.length-1))*IW,y:PT+IH*(1-(d.maxW-minW)/range),d}));
  const defs=mk('defs');const grad=mk('linearGradient',{id:'cg'+name.replace(/[^a-z]/gi,''),x1:'0%',y1:'0%',x2:'0%',y2:'100%'});
  grad.append(mk('stop',{offset:'0%','stop-color':'#3b82f6','stop-opacity':'0.4'}),mk('stop',{offset:'100%','stop-color':'#3b82f6','stop-opacity':'0'}));
  defs.appendChild(grad);svg.appendChild(defs);
  svg.appendChild(mk('path',{d:'M'+pts[0].x+','+(PT+IH)+' '+pts.map(p=>`L${p.x},${p.y}`).join(' ')+` L${pts[pts.length-1].x},${PT+IH} Z`,fill:`url(#cg${name.replace(/[^a-z]/gi,'')})`}));
  svg.appendChild(mk('path',{d:'M'+pts.map(p=>`${p.x},${p.y}`).join(' L'),fill:'none',stroke:'#3b82f6',strokeWidth:2.5,strokeLinecap:'round',strokeLinejoin:'round'}));
  pts.forEach((p,i)=>{ svg.appendChild(mk('circle',{cx:p.x,cy:p.y,r:4,fill:'#3b82f6',stroke:'#0a0f1a',strokeWidth:2}));const lbl=document.createElementNS('http://www.w3.org/2000/svg','text');lbl.setAttribute('x',p.x);lbl.setAttribute('y',p.y-8);lbl.setAttribute('text-anchor','middle');lbl.setAttribute('font-size','9');lbl.setAttribute('fill','#60a5fa');lbl.setAttribute('font-weight','700');lbl.setAttribute('font-family','Heebo,sans-serif');lbl.textContent=p.d.maxW+'ק"ג';svg.appendChild(lbl); });
  card.appendChild(svg);
  const first=weights[0],last=weights[weights.length-1];
  if(last>first){const b=el('div','chart-badge up');b.textContent='↑ +'+(last-first)+'ק"ג';card.appendChild(b);}
  return card;
}

renderWelcome();

</script>
